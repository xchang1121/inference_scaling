[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "online-speculation"
version = "0.2.0"
description = "Native Uno inference optimization and request-local online LoRA distillation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["native_online_policy", "native_fast_weights", "native_norm", "native_update_graph"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B023"]
