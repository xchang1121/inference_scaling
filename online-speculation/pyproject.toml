[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "online-speculation"
version = "0.1.0"
description = "Lossless online adaptation experiments for Uno-style speculative decoding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.16,<0.17",
]
uno-hf = [
  "accelerate>=1.14,<2",
  "peft==0.20.0",
  "safetensors>=0.8,<1",
  "torch>=2.11,<3",
  "transformers>=5.14,<6",
]

[project.scripts]
online-speculation-preflight = "online_speculation.preflight:main"
online-speculation-uno1b = "online_speculation.hf_uno:main"
online-speculation-stage2-analysis = "online_speculation.stage2_analysis:main"
online-speculation-stage3-simulation = "online_speculation.online_simulation:main"
online-speculation-online-uno1b = "online_speculation.hf_online_uno:main"
online-speculation-stage4-analysis = "online_speculation.stage4_analysis:main"
online-speculation-stage5-analysis = "online_speculation.stage5_analysis:main"
online-speculation-stream-uno1b = "online_speculation.hf_stream_uno:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B023"]
