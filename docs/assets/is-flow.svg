<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" role="img" aria-labelledby="title desc">
  <title id="title">默认两阶段思考段 IS</title>
  <desc id="desc">首轮提交候选与补全，按权重选取并固定前缀，保留选中的完整补全；由未选补全分配末轮预算，执行末轮探索或复用，最后生成最终内容。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52667d"/></marker></defs>
  <rect width="960" height="304" rx="12" fill="#f6f8fa"/>
  <g fill="#fff" stroke="#b8c9da" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="94" rx="10"/>
    <rect x="340" y="20" width="280" height="94" rx="10"/>
    <rect x="660" y="20" width="280" height="94" rx="10"/>
    <rect x="660" y="164" width="280" height="94" rx="10"/>
    <rect x="340" y="164" width="280" height="94" rx="10"/>
    <rect x="20" y="164" width="280" height="94" rx="10"/>
  </g>
  <g stroke="#52667d" stroke-width="2" marker-end="url(#arrow)" fill="none"><path d="M302 67 H336"/><path d="M622 67 H656"/><path d="M800 116 V160"/><path d="M658 211 H624"/><path d="M338 211 H304"/></g>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle" fill="#17324d">
    <g font-size="19" font-weight="600"><text x="160" y="51">1. 首轮生成</text><text x="480" y="51">2. 按权重选择</text><text x="800" y="51">3. 保留完整补全</text><text x="800" y="195">4. 分配末轮探索</text><text x="480" y="195">5. 选定完整思考段</text><text x="160" y="195">6. 生成最终内容</text></g>
    <g font-size="16"><text x="160" y="78">提交 M 组候选</text><text x="160" y="101">每组最多 K 条补全</text><text x="480" y="78">先选候选，再选补全</text><text x="480" y="101">固定至多 B 个 token</text><text x="800" y="78">选中序列与奖励留待复用</text><text x="800" y="101">未选 rollout 提供预算统计</text><text x="800" y="222">按权重差异决定是否探索</text><text x="800" y="245">执行末轮池或直接复用</text><text x="480" y="222">从末轮池选择或沿用参考</text><text x="480" y="245">固定剩余思考内容</text><text x="160" y="222">基础模型在思考之后续写</text><text x="160" y="245">最终内容不再进行 IS 选择</text></g>
    <text x="480" y="286" font-size="15" fill="#52667d">提前选择使用未完成前缀的权重估计；完整池模式等待全部规定补全。</text>
  </g>
</svg>
