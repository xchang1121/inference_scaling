name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,dllm,dllm-training]"
          python -m pip check
      - name: Static checks
        run: |
          python -m ruff check experiments src tests
          python -m mypy src/inference_scaling/shared experiments/shared --ignore-missing-imports
      - name: Unit and integration tests
        run: python -m pytest -q
